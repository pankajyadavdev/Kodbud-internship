
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top navigation -->
    <header class="top-bar">
        <nav class="top-links" aria-label="Top navigation">
            <a href="#">Gmail</a>
            <a href="#">Images</a>

            <a href="#" class="apps-button" aria-label="Google apps">
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
            </a>

            <a href="#" class="sign-in">Sign in</a>
        </nav>
    </header>

    <!-- Main search area -->
    <main class="main-content">

        <div class="google-logo" role="img" aria-label="Google">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </div>

        <form class="search-form" action="#">
            <div class="search-box">
                <span class="search-icon" aria-hidden="true"></span>

                <input
                    type="text"
                    aria-label="Search"
                    autocomplete="off">

                <button type="button" class="tool-icon mic-icon"
                        aria-label="Voice search">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
                        <path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8"/>
                    </svg>
                </button>

                <button type="button" class="tool-icon camera-icon"
                        aria-label="Search by image">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="6" width="18" height="14" rx="3"/>
                        <circle cx="12" cy="13" r="3.5"/>
                        <path d="m8 6 1.5-2h5L16 6"/>
                    </svg>
                </button>
            </div>

            <div class="search-buttons">
                <button type="submit">Google Search</button>
                <button type="button">I'm Feeling Lucky</button>
            </div>
        </form>

        <p class="language-options">
            Language Options:
            <a href="#">हिन्दी</a>
            <a href="#">English</a>
        </p>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="country">India</div>

        <div class="footer-bottom">
            <nav class="footer-group" aria-label="About Google">
                <a href="#">About</a>
                <a href="#">How Search works</a>
            </nav>

            <nav class="footer-group footer-right" aria-label="Settings">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </nav>
        </div>
    </footer>

</body>
</html>
