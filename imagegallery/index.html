
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="page-header">
        <h1>Explore the World</h1>
        <p>A collection of beautiful places and moments.</p>
    </header>

    <main class="gallery">

        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80"
                 alt="Mountain lake surrounded by green hills">
            <figcaption>Mountain Escape</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80"
                 alt="Scenic landscape under a beautiful sky">
            <figcaption>Open Landscapes</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=900&q=80"
                 alt="Ocean waves meeting the shore">
            <figcaption>Ocean Breeze</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80"
                 alt="Sunlight filtering through a green forest">
            <figcaption>Into the Forest</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=900&q=80"
                 alt="Snow-covered mountain beneath a starry sky">
            <figcaption>Starry Mountains</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=80"
                 alt="Golden sunrise over a peaceful landscape">
            <figcaption>Golden Sunrise</figcaption>
        </figure>

    </main>

    <footer>
        <p>Made with HTML & CSS</p>
    </footer>

</body>
</html>
